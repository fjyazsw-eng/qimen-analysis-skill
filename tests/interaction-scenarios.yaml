schema_version: "1.0.1"
purpose: "验证收盘门控、问题范围、固定输出与同盘同问稳定性"
tests:
  - test_id: "INT-001"
    situation: "用户只发送完整盘面，没有提出问题。"
    expect:
      - "进入收盘建档，不做取用或吉凶判断。"
      - "确认收到并最多提出四个必要引导问题。"
      - "不分析婚恋、健康、财运或性格。"
  - test_id: "INT-002"
    situation: "用户发送盘面并明确询问三个月内求职能否获得合适录用。"
    expect:
      - "问题与时间范围已清楚时可直接进入正式分析。"
      - "只加载职业求职范围，不扩展到未问领域。"
  - test_id: "INT-003"
    situation: "用户只说想看看工作，但未说明当前工作、求职、调动还是项目。"
    expect:
      - "进入补问确认，不用试探性断语代替问题定义。"
      - "先锁定具体职业子类型和关注时间范围。"
  - test_id: "INT-004"
    situation: "同一版本下以完全相同的盘面、问题、角色和时间范围再次分析。"
    expect:
      - "主辅取用、主证据顺序、总体倾向和固定结论槽位保持稳定。"
      - "允许措辞变化，不允许核心结论因自由联想漂移。"
  - test_id: "INT-005"
    situation: "复跑同盘同问时用户补充了对方身份和一个关键现实事实。"
    expect:
      - "若结论改变，先指出新事实如何改变取用或证据权重。"
      - "无法找到变化来源时保留原结论并标记复核。"
  - test_id: "INT-006"
    situation: "完整分析后用户只追问应期。"
    expect:
      - "沿用原盘、取用和核心结论，仅回答应期范围。"
      - "不重做全盘或增加无关领域判断。"
  - test_id: "INT-007"
    situation: "用户明确要求简短回答。"
    expect:
      - "使用唯一简版骨架并保留冲突与不确定性。"
      - "不临时创造第三种输出结构。"
  - test_id: "INT-008"
    situation: "正式分析中某固定栏目没有相关证据。"
    expect:
      - "保留固定栏目并写未提供、不适用或证据不足。"
      - "不删除或重排一级栏目。"
