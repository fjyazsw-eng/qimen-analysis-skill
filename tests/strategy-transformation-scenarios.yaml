version: 1.4.0
scenarios:
  - id: ST-01
    situation: "核心事项宫克主体，B级宫能泄事项并生主体，但该宫不是传统吉门。"
    expected: "允许进入候选转化宫；不得因门名非吉而排除，继续验证旺衰、特殊状态与现实映射。"
  - id: ST-02
    situation: "某宫临生门六合，但与主体、事项及核心矛盾无生克或现实角色联系。"
    expected: "不得认定为生机宫，不得据此给方位化解。"
  - id: ST-03
    situation: "原始定性平偏凶，后续发现可执行的第三方协调路径。"
    expected: "保留原始定性与自然趋势，只在策略层说明条件性改善路径。"
  - id: ST-04
    situation: "核心宫的门星象意有利，但门宫旺衰和月令旺衰均弱。"
    expected: "保留有利性质但降低兑现强度，不得只凭吉门吉星判吉。"
  - id: ST-05
    situation: "值符值使与核心用神无直接关系。"
    expected: "仍完成全局检查并作为背景，不强行映射领导或流程角色。"
  - id: ST-06
    situation: "值使与事项宫直接重叠，且值使门参与核心推进链。"
    expected: "相关升权，作为主要运行通道证据，但不得凌驾核心宫整体与宫际生克。"
