schema_version: "1.2.0"
purpose: "验证多局演化、旧预测冻结和后验污染防护；不验证预测准确率"
scenarios:
  - test_id: "MC-001"
    situation: "同一问题先后形成两局，一吉一凶"
    expect:
      - "不进行一比一多数表决"
      - "解释人物、环境、行为或时间上的变化"
  - test_id: "MC-002"
    situation: "第二局强化旧局的推进信号"
    expect:
      - "保留旧预测原文"
      - "新增强化记录而不覆盖"
  - test_id: "MC-003"
    situation: "第二局出现反转信号但问题定义已改变"
    expect:
      - "先说明目标事件不可直接比较"
      - "不把变化伪装为同一预测反转"
  - test_id: "MC-004"
    situation: "新局让原候选窗口推迟"
    expect:
      - "输出旧预测与推迟依据"
      - "台账保留原窗口和新记录"
  - test_id: "MC-005"
    situation: "现实结果出现后发现原分析未提及的一个符号"
    expect:
      - "标记为后验发现"
      - "不得计为事前命中"
  - test_id: "MC-006"
    situation: "三局中两局定性较吉、一局较凶"
    expect:
      - "不按二比一决定结论"
      - "输出不变、增强、减弱、反转和新增变量"
  - test_id: "MC-007"
    situation: "旧局预测已冻结，用户补充了关键现实事实"
    expect:
      - "追加事实变更与修正记录"
      - "不静默编辑旧分析"
  - test_id: "MC-008"
    situation: "两个局使用不同排盘体系"
    expect:
      - "先标记口径不可直接比较"
      - "不强行形成连续演化"
  - test_id: "MC-009"
    situation: "规则在一个成功案例中看似命中"
    expect:
      - "不因单例升级可信度"
      - "保留失败与未决案例等待回测"
  - test_id: "MC-010"
    situation: "回测连续触宫规则时部分目标只到联系、部分达到复合"
    expect:
      - "按预先定义的目标事件分别统计"
      - "不把联系统一算作复合命中"
