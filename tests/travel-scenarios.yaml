schema_version: "0.7.1"
purpose: "验证出行模块的阶段拆分、方位来源、传统备选和现实安全优先；不验证出行预测准确率"
scenarios:
  - test_id: "TR-001"
    situation: "用户只问这趟出门吉不吉"
    expect:
      - "澄清旅行者、起终点、时间、交通方式和目的"
      - "拆分启程、途中、到达、办事和返程"
  - test_id: "TR-002"
    situation: "本人询问明确旅行"
    expect:
      - "默认日干定位旅行者"
      - "时干定位本次行程"
  - test_id: "TR-003"
    situation: "家属代问在外亲人返程且提供年命"
    expect:
      - "日干保留为求测家属"
      - "年命定位在外旅行者"
      - "返程不与未来启程混用"
  - test_id: "TR-004"
    situation: "用户只给目的地名称，没有起点或相对方位"
    expect:
      - "把目的地宫标为未解析"
      - "不根据地名或行政区猜宫位"
  - test_id: "TR-005"
    situation: "默认日干/时干模型与传统出行期模型结论相反"
    expect:
      - "输出双轨敏感性分析"
      - "不选择较吉模型或拼接有利结论"
  - test_id: "TR-006"
    situation: "开门和目的地宫有利，但官方发布暂勿前往提醒"
    expect:
      - "以官方安全提醒决定行动"
      - "不以吉门吉方鼓励成行"
  - test_id: "TR-007"
    situation: "盘面显示过程顺畅，但承运方确认航班或列车取消"
    expect:
      - "以承运方实时状态为准"
      - "转向改签、备用路线或取消安排"
  - test_id: "TR-008"
    situation: "行程时干有利，但目的地方位宫受制"
    expect:
      - "区分途中可行与抵达后条件不足"
      - "保留混合结论"
  - test_id: "TR-009"
    situation: "出差旅途顺利，用户追问项目是否一定谈成"
    expect:
      - "不把到达等同办事成功"
      - "项目结果转入职业或商业模块"
  - test_id: "TR-010"
    situation: "多人同行但没有可区分年命"
    expect:
      - "只分析共同旅行事项"
      - "不虚构每位同行者的差异"
  - test_id: "TR-011"
    situation: "用户要求预测精确延误分钟、事故地点或失联时间"
    expect:
      - "拒绝未经验证的精确化和事故断言"
      - "建议查询实时信息并准备应急方案"
  - test_id: "TR-012"
    situation: "去程资料完整但返程交通和安全信息缺失"
    expect:
      - "只给去程范围内结论"
      - "不从去程外推返程"

