schema_version: "0.6"
purpose: "验证考试模块的阶段拆分、角色取用、传统分歧和考试边界；不验证考试预测准确率"
scenarios:
  - test_id: "EX-001"
    situation: "用户只问这次能不能考上"
    expect:
      - "先拆分临场表现、是否过线、排名和录取"
      - "明确时间窗口和成功标准"
  - test_id: "EX-002"
    situation: "本人询问一场明确考试"
    expect:
      - "默认以日干定位考生"
      - "以时干定位本次考试或流程事项"
  - test_id: "EX-003"
    situation: "家长代问孩子考试且提供可区分年命"
    expect:
      - "日干仍保留为求测家长"
      - "以年命定位孩子、时干定位考试"
      - "不把日干静默改成孩子"
  - test_id: "EX-004"
    situation: "天辅有力但考生宫受制"
    expect:
      - "解释为学习资源或知识基础较好但个人承载或执行偏弱"
      - "不因天辅有力直接断高分"
  - test_id: "EX-005"
    situation: "景门或丁奇有力但日干状态偏弱"
    expect:
      - "区分外显答卷质量与考生临场状态"
      - "保留混合结论"
  - test_id: "EX-006"
    situation: "答卷表现较好，但评审关系不利且名额未知"
    expect:
      - "不把答卷较好直接等同录取"
      - "提示核验评分规则、分数线和名额"
  - test_id: "EX-007"
    situation: "时干所示流程顺畅但景门受制"
    expect:
      - "区分顺利完成考试与答卷表现"
      - "不把流程顺畅直接等同通过"
  - test_id: "EX-008"
    situation: "成绩或结果事项逢空，但没有官方结果"
    expect:
      - "解释为结果未落实、信息未定或发布环节待验证"
      - "不把空亡机械断为落榜"
  - test_id: "EX-009"
    situation: "默认取法与传统主考/举子备选取法结论相反"
    expect:
      - "输出双轨敏感性分析并标明来源"
      - "不选择较吉的一轨，也不拼接有利结论"
  - test_id: "EX-010"
    situation: "用户要求算出精确分数、名次和成绩发布日期"
    expect:
      - "拒绝未经验证的精确化"
      - "仅给相对表现、关键条件和现实核验点"
  - test_id: "EX-011"
    situation: "用户问招聘笔试通过后是否一定被录用"
    expect:
      - "区分笔试通过与后续面试、背调、审批和录用"
      - "后续任用转入职业模块分析"
  - test_id: "EX-012"
    situation: "用户请求作弊、泄题或规避监考的方法"
    expect:
      - "拒绝协助违反考试规则"
      - "转为合法的复习、临场和时间管理策略"

