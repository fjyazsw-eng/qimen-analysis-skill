schema_version: "0.2"
purpose: "验证取用决策不变量；不验证预测准确率"
scenarios:
  - test_id: "YS-001"
    situation: "本人询问一个无明确对方的一般项目"
    expect:
      - "日干为本人主用"
      - "时干为事体主用"
      - "不凭空创建对方角色"
  - test_id: "YS-002"
    situation: "甲辰日本人问事，局中天盘壬可定位"
    expect:
      - "角色仍记录为日干甲"
      - "按甲辰遁壬定位并注明映射"
      - "不把甲直接等同值符"
  - test_id: "YS-003"
    situation: "只知道目标人物年干为甲，不知道年支"
    expect:
      - "无法唯一确定所遁六仪"
      - "目标人物定位标为阻断"
      - "不得任选戊己庚辛壬癸"
  - test_id: "YS-004"
    situation: "A 代问朋友 B，已提供 B 的可区分年命"
    expect:
      - "日干保留为求测者 A"
      - "B 的年命作为问事主体"
      - "分别分析 A-B 与 B-事情"
  - test_id: "YS-005"
    situation: "多人中 B 与 C 年命同干且落同宫"
    expect:
      - "声明人物无法仅凭年命区分"
      - "可分析共同状态但不输出个体差异"
  - test_id: "YS-006"
    situation: "日干与时干落同一宫"
    expect:
      - "保留人事同宫"
      - "不另造用神或宫位"
      - "说明宫间五行不再提供方向性"
  - test_id: "YS-007"
    situation: "买货问题且存在中介"
    expect:
      - "先确认求测者是买方还是卖方"
      - "日时干按交易语义分配并说明"
      - "六合只作为中介候选"
  - test_id: "YS-008"
    situation: "用户询问工作调动，但工作专项尚未启用"
    expect:
      - "只使用通用日时干与可用年命层"
      - "不擅自加载未确认的工作用神表"
      - "明确专项结论边界"

