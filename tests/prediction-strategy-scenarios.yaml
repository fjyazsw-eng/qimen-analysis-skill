schema_version: "1.2.0"
purpose: "验证定性评价、四层预测、未来事件树和策略闭环；不验证预测准确率"
scenarios:
  - test_id: "PS-001"
    situation: "用户提出明确实战问题并要求完整分析"
    expect:
      - "正式输出最前面固定出现四行定性评价"
      - "等级只使用统一九级规格"
  - test_id: "PS-002"
    situation: "盘面同时有吉门和关键宫受制"
    expect:
      - "不凭吉门直接定吉"
      - "综合取用、动力、落实和未来风险定级"
  - test_id: "PS-003"
    situation: "证据混合但阻力略强且存在可调整路径"
    expect:
      - "给出平偏凶或小凶并说明可调整"
      - "不使用平逃避方向判断"
  - test_id: "PS-004"
    situation: "复杂项目存在审批、资金和外部决策三个条件"
    expect:
      - "建立有证据的主路径和有限条件分支"
      - "每个重要分支包含验证信号"
  - test_id: "PS-005"
    situation: "用户问项目成败但盘面只支持进入谈判阶段"
    expect:
      - "区分谈判与签约或落地"
      - "不把较早事件节点当作最终成功"
  - test_id: "PS-006"
    situation: "主体旺而事情弱，用户问现在是否强推"
    expect:
      - "识别主体能力与事项承接条件不一致"
      - "建议补资源、换渠道或等待而非只说事情弱"
  - test_id: "PS-007"
    situation: "盘面支持推进，但关键决策方现实中可能否决"
    expect:
      - "区分可控与不可控变量"
      - "把明确否决列为失效条件"
  - test_id: "PS-008"
    situation: "用户在三个现实方案之间选择"
    expect:
      - "按收益、阻力、风险、时机、资源和成功条件比较"
      - "给出优先方案、备选与放弃条件"
  - test_id: "PS-009"
    situation: "方向宫有吉门但路线存在安全风险"
    expect:
      - "现实安全优先淘汰危险路线"
      - "不机械使用吉门方向"
  - test_id: "PS-010"
    situation: "用户只发送完整局式但没有问题"
    expect:
      - "只回复局式已读取可以开始提问"
      - "不输出定性或未问分析"
  - test_id: "PS-011"
    situation: "用户明确要求只给结论"
    expect:
      - "使用定性评价、未来、应期、怎么做、注意的唯一简版骨架"
      - "不输出完整十二段"
  - test_id: "PS-012"
    situation: "软件仅标记伏吟候选和空亡核验冲突"
    expect:
      - "候选结构只进入敏感性轨"
      - "未复核信息不参与高权重定性"
