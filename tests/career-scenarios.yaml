schema_version: "0.3"
purpose: "验证职业模块的取用、分层和边界；不验证预测准确率"
scenarios:
  - test_id: "CR-001"
    situation: "用户只问工作怎么样"
    expect:
      - "只分析当前职业状态、动力和阻力"
      - "不擅自改成调动、晋升或离职问题"
  - test_id: "CR-002"
    situation: "本人询问已进入面试阶段的明确岗位"
    expect:
      - "日干定位求职者"
      - "开门定位岗位/平台"
      - "时干定位本次面试与录用流程"
  - test_id: "CR-003"
    situation: "开门结构有利但时干空亡或受制"
    expect:
      - "输出岗位可能不错但流程尚未落实的混合结论"
      - "不因开门有利直接断录用"
  - test_id: "CR-004"
    situation: "时干推进有力但开门结构受限"
    expect:
      - "区分流程顺利与岗位长期质量"
      - "不把推进顺利等同职业适配"
  - test_id: "CR-005"
    situation: "内部调动问题见反吟和马星"
    expect:
      - "将反吟与马星作为变化修正"
      - "仍检查岗位机会、时干流程与审批条件"
      - "不直接断必调"
  - test_id: "CR-006"
    situation: "晋升问题中值符支持但值使流程受阻"
    expect:
      - "区分决策意向和执行手续"
      - "形成有支持但落地仍卡的结论"
  - test_id: "CR-007"
    situation: "用户比较两份 offer，但输入没有可靠盘内标识区分 A/B"
    expect:
      - "不让一个开门同时伪装成两个独立岗位"
      - "要求补充可区分信息、做条件分析或分别起问"
  - test_id: "CR-008"
    situation: "代问朋友的求职结果且已提供朋友年命"
    expect:
      - "日干保留为求测者"
      - "朋友年命作为职业主体"
      - "分析朋友与岗位/流程关系"
  - test_id: "CR-009"
    situation: "工作项目询问能否落地，但未定义落地"
    expect:
      - "先澄清立项、获批、签约、启动、交付或回款"
      - "不替用户选择成功标准"
  - test_id: "CR-010"
    situation: "项目执行有机会，但用户进一步追问利润和回款"
    expect:
      - "职业项目模块只回答执行与组织部分"
      - "财务结论留待商业/财运模块"

