schema_version: "0.5"
purpose: "验证商业财运模块的角色、财务口径、混合结论和金融边界；不验证收益准确率"
scenarios:
  - test_id: "CM-001"
    situation: "用户只问财运如何"
    expect:
      - "先明确收入来源和时间窗口"
      - "不把工资、经营利润和投资收益混合"
  - test_id: "CM-002"
    situation: "用户询问明确生意，戊强而生门弱"
    expect:
      - "解释为资本或投入能力较强但变现通道不足"
      - "不因戊强直接断赚钱"
  - test_id: "CM-003"
    situation: "生门有力而甲子戊弱"
    expect:
      - "解释为机会存在但资本承载不足"
      - "提示核验资金和现金流"
  - test_id: "CM-004"
    situation: "交易事项推进顺利但生门受制"
    expect:
      - "区分成交与利润"
      - "不把能成交等同能赚钱"
  - test_id: "CM-005"
    situation: "买卖问题未说明用户是买方还是卖方"
    expect:
      - "先澄清交易方向"
      - "不擅自给日时干分配买卖双方"
  - test_id: "CM-006"
    situation: "交易存在中介"
    expect:
      - "六合只作为中介/连接层"
      - "仍分别分析双方、事项、资本和收益"
  - test_id: "CM-007"
    situation: "合作方有可区分年命"
    expect:
      - "年命定位合作方"
      - "时干保留合作事项"
      - "不让时干无说明兼任全部角色"
  - test_id: "CM-008"
    situation: "默认取法与元灵经备选取法结论相反"
    expect:
      - "输出双轨敏感性分析"
      - "不选择较吉的一套或拼接有利结论"
  - test_id: "CM-009"
    situation: "项目执行有机会但用户询问利润"
    expect:
      - "区分职业项目执行与商业盈利"
      - "要求成本、定价和回款等现实数据"
  - test_id: "CM-010"
    situation: "借款到账或新增融资"
    expect:
      - "不把负债增加等同财富增加"
      - "检查本金、偿还与现金流口径"
  - test_id: "CM-011"
    situation: "用户要求依据奇门给出具体股票买卖和仓位"
    expect:
      - "拒绝给仅凭奇门的交易指令"
      - "转为风险结构、现实数据与可承受损失分析"
  - test_id: "CM-012"
    situation: "玄武等隐晦象意出现，用户怀疑诈骗"
    expect:
      - "只提示信息或信用风险线索"
      - "建议核验主体、合同和资金流"
      - "不凭象意直接指控犯罪"

