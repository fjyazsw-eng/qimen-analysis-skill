schema_version: "1.1.0"
purpose: "验证标准结构化局式的完整读取、宫位综合、干支长生与冲突处理"
tests:
  - test_id: "SYN-001"
    situation: "局式只要求确认读取，九宫完整且尚无占问事项。"
    expect:
      - "只做最低限度一致性核验并回复局式已读取，可以开始提问。"
      - "不提前取用或分析任何宫位吉凶。"
  - test_id: "SYN-002"
    situation: "值符字段写天冲落艮八宫，艮八宫九星也为天冲。"
    expect:
      - "一致性核验记为相符。"
      - "正式分析时区分天冲星功能和值符身份，但同一事实不重复计权。"
  - test_id: "SYN-003"
    situation: "值使字段与落宫中的八门字段不一致。"
    expect:
      - "列为数据冲突并说明受影响的执行通道结论。"
      - "不自行改盘或任选更有利的一项。"
  - test_id: "SYN-004"
    situation: "中五宫只给地盘干并声明中宫不判。"
    expect:
      - "按体系声明接受中宫特殊结构。"
      - "不把缺少门星神误报为九宫不完整。"
  - test_id: "SYN-005"
    situation: "双地支宫的同一天干分别标注两个不同十二长生状态。"
    expect:
      - "原样保留两个状态，不平均、不投票、不挑较吉者。"
      - "无法定位具体支时将差异列为不确定性。"
  - test_id: "SYN-006"
    situation: "地盘干十二长生标注为墓，但特殊状态没有单列入墓。"
    expect:
      - "只按十二长生阶段处理。"
      - "不得重复判断为奇门入墓。"
  - test_id: "SYN-007"
    situation: "原局空亡宫与程序时空复核结果不同。"
    expect:
      - "主轨保留原局标记，复核结果只进入敏感性轨。"
      - "不把两套候选宫全部同时视为空亡。"
  - test_id: "SYN-008"
    situation: "全局只写未检测到伏吟反吟，没有说明击刑和入墓。"
    expect:
      - "伏吟反吟记录为未检测到，击刑入墓记录为未提供。"
      - "不把未提供自动改写为无。"
  - test_id: "SYN-009"
    situation: "核心宫同时提供门星神、天地盘干、寄干、四类门星旺衰、长生与门迫。"
    expect:
      - "覆盖账本为每项标记已采用、保留、冲突或不适用。"
      - "宫内状态与全局门迫汇总只修正一次。"
  - test_id: "SYN-010"
    situation: "天盘干克地盘干，但天盘干自身阶段弱且宫内通道受门迫。"
    expect:
      - "先解释当前行动试图控制基础，再由阶段和门迫修正有效性。"
      - "不因单一干克关系直接判成功。"
  - test_id: "SYN-011"
    situation: "输入没有声明八神体系，但外八宫神名完整且一致采用白虎、玄武序列。"
    expect:
      - "可临时识别为白虎玄武体系并明确这是根据名单作出的识别。"
      - "不静默替换神名或混用两套规则。"
  - test_id: "SYN-012"
    situation: "输入没有说明天禽是中宫、寄宫还是与其他星同宫。"
    expect:
      - "将天禽处理方式列为限制项。"
      - "不自行补出天禽位置。"
