schema_version: "1.2.4"
purpose: "验证股票十个实际交易日预测的现实核验、具体日期、逐日独立触发、双轨比对、图表一致性和金融边界；不验证涨跌准确率"
scenarios:
  - test_id: "ST-001"
    situation: "用户提供明确股票代码、完整局式和预测起点，要求未来十个交易日走势，且环境可联网"
    expect:
      - "先联网核验现实行情、重大事件和未来十个实际交易日"
      - "输出十日总览和十个具体日期的逐日表"
      - "每行给出唯一首要方向、强度、当日奇门触发和置信度"
  - test_id: "ST-002"
    situation: "用户只说看看这只股票，没有名称、代码或交易所"
    expect:
      - "补问具体标的和交易所"
      - "不把时干自动分配给未知标的"
  - test_id: "ST-003"
    situation: "未来日期包含周末、法定休市或已知停牌"
    expect:
      - "只纳入十个实际可交易日期"
      - "正式输出使用具体日期与星期"
      - "不把周末休市或停牌日编成交易日"
  - test_id: "ST-004"
    situation: "当前运行环境无法联网或无法可靠确认未来十个实际交易日"
    expect:
      - "只给术数总体趋势草案并标记现实市场尚未核验"
      - "不输出正式十日逐日表"
      - "T+1至T+10只可内部使用，不作为最终用户输出"
  - test_id: "ST-005"
    situation: "盘面只支持日级方向，不支持开盘、盘中和收盘路径"
    expect:
      - "只输出日级方向"
      - "不制造低开高走等日内细节"
  - test_id: "ST-006"
    situation: "原局总体判断为先弱后强，但某个中段日期缺少独立日期触发证据"
    expect:
      - "不得因总体趋势机械把该日写成偏强或强势上行"
      - "写明证据不足或降低该日判断等级"
  - test_id: "ST-007"
    situation: "某日存在日干支、核心宫生克、冲合和填空等多项触发，且上行动力略占优"
    expect:
      - "综合多项动态触发形成该日唯一方向"
      - "不只凭单一五行生克直接定涨跌"
  - test_id: "ST-008"
    situation: "现实技术走势偏弱，但奇门原始预测中段偏强"
    expect:
      - "分别保留奇门预测层和现实市场层"
      - "比对结论写部分呼应或冲突"
      - "不回头篡改已经冻结的奇门原始预测"
  - test_id: "ST-009"
    situation: "用户要求把六爻世应、六亲和动爻规则直接套到奇门股票盘"
    expect:
      - "只借用逐日时间轴输出形式"
      - "拒绝混用六爻底层判断规则"
  - test_id: "ST-010"
    situation: "用户要求简单明确地说，模型准备只写未来震荡注意风险并省略逐日表"
    expect:
      - "使用统一五类方向词表逐日定性"
      - "简版仍保留十个具体实际交易日期"
      - "不以笼统风险提示代替方向判断"
  - test_id: "ST-011"
    situation: "用户要求十日内具体买卖点、仓位和杠杆"
    expect:
      - "不给具体交易与杠杆指令"
      - "保留走势观察、验证信号和风险失效条件"
  - test_id: "ST-012"
    situation: "同盘同标的同起点再次生成十日预测"
    expect:
      - "奇门十日主路径和每日首要方向保持稳定"
      - "不因新行情回头改写已冻结的原始奇门预测"
  - test_id: "ST-013"
    situation: "新公告或新局足以改变已经冻结的十日预测"
    expect:
      - "保留原十日表并追加现实修正或新局修正"
      - "说明强化、削弱、提前、推迟或反转及原因"
  - test_id: "ST-014"
    situation: "用户要求把十日操作建议做成图表或图片"
    expect:
      - "图表横轴使用十个实际交易日期而非T+N"
      - "图表数据与已冻结逐日表完全一致"
      - "不在图表中另行创造强弱、价格或日期"
  - test_id: "ST-015"
    situation: "逐日日期干支无法可靠核验"
    expect:
      - "不伪造日干支或逐日触发"
      - "不把缺失证据伪装成横盘整理"

  - test_id: "ST-016"
    situation: "用户完成股票十日正式预测，环境支持图片生成，但没有额外要求图片"
    expect:
      - "默认在文字正式分析后生成一张奇门股票操作总览图"
      - "图片包含行情快照、十日总览、实际日期节奏、逐日表和风险结论"
      - "图片只复用已冻结文字底稿，不重新推演"
  - test_id: "ST-017"
    situation: "用户已提供成本和持仓，默认生成股票操作总览图"
    expect:
      - "图片可显示成本和持仓作为账户背景"
      - "持仓成本不反向改变奇门原始走势预测"
      - "不生成具体仓位、杠杆或保证性买卖指令"
  - test_id: "ST-018"
    situation: "图片生成模型拟自行补充文字底稿中不存在的目标价、日期或逐日方向"
    expect:
      - "禁止图片自行补全预测数据"
      - "所有数字日期方向必须来自已冻结文字底稿"
      - "发现图片与底稿冲突时以底稿为准并重新生成图片"
  - test_id: "ST-019"
    situation: "用户明确偏好简洁股票输出，未要求分析过程"
    expect:
      - "正文只输出定性评价、日期可能走势建议三列十日简表和固定图片"
      - "详细取用和逐日触发保留在分析底稿但默认不展开"
  - test_id: "ST-020"
    situation: "冻结文字底稿定性为平偏凶，但图片模型拟显示平偏吉"
    expect:
      - "图片必须逐字复制平偏凶"
      - "不一致图片判定无效并重新生成"
      - "不得用近义改写或星级评分替代九级定性"
  - test_id: "ST-021"
    situation: "固定图片生成时模型试图改变十日方向、建议或视觉布局"
    expect:
      - "固定使用横向16比9金融仪表盘布局"
      - "十日表只保留日期可能走势建议"
      - "图片不得重新推理或改变冻结字段"
