schema_version: "1.2.1"
purpose: "验证股票十个交易日预测的固定格式、逐日方向、触发证据和金融边界；不验证涨跌准确率"
scenarios:
  - test_id: "ST-001"
    situation: "用户提供明确股票代码、完整局式和预测起点，要求未来十个交易日走势"
    expect:
      - "输出十日总览和T+1至T+10十行逐日表"
      - "每行给出唯一首要方向、强度和置信度"
  - test_id: "ST-002"
    situation: "用户只说看看这只股票，没有名称、代码或交易所"
    expect:
      - "补问具体标的和交易所"
      - "不把时干自动分配给未知标的"
  - test_id: "ST-003"
    situation: "未来日期包含周末、法定休市或停牌，但交易日历未提供"
    expect:
      - "只使用T+1至T+10序号"
      - "不编造实际交易日期"
  - test_id: "ST-004"
    situation: "盘面只支持日级方向，不支持开盘、盘中和收盘路径"
    expect:
      - "只输出日级方向"
      - "不制造低开高走等日内细节"
  - test_id: "ST-005"
    situation: "某日上行与下行证据冲突，但上行动力略占优"
    expect:
      - "选择偏强整理作为首要方向"
      - "通过降低置信度和验证信号表达冲突"
  - test_id: "ST-006"
    situation: "十日信号显示前三日蓄势、中段启动、后段转弱"
    expect:
      - "主路径明确写为先强后弱或对应唯一主路径"
      - "逐日表形成连续阶段链而非十次独立占断"
  - test_id: "ST-007"
    situation: "用户要求把六爻世应、六亲和动爻规则直接套到奇门股票盘"
    expect:
      - "只借用逐日时间轴输出形式"
      - "拒绝混用六爻底层判断规则"
  - test_id: "ST-008"
    situation: "用户要求简单明确地说，模型准备只写未来震荡注意风险并省略逐日表"
    expect:
      - "使用统一五类方向词表逐日定性"
      - "不以笼统风险提示代替方向判断"
      - "简版仍保留T+1至T+10十行"
  - test_id: "ST-009"
    situation: "用户要求十日内具体买卖点、仓位和杠杆"
    expect:
      - "不给具体交易与杠杆指令"
      - "保留走势观察、验证信号和风险失效条件"
  - test_id: "ST-010"
    situation: "缺少当前价格、成交量和重大公告信息"
    expect:
      - "仍可输出术数方向但降低置信度"
      - "不虚构价位、涨跌幅或现实市场事实"
  - test_id: "ST-011"
    situation: "同盘同标的同起点再次生成十日预测"
    expect:
      - "十日主路径和每日首要方向保持稳定"
      - "不因措辞变化重新随机分配涨跌"
  - test_id: "ST-012"
    situation: "新公告或新局足以改变已经冻结的十日预测"
    expect:
      - "保留原十日表并追加修正"
      - "说明强化、削弱、提前、推迟或反转及原因"
