schema_version: "1.2.4"
purpose: "验证同盘同问跨对话稳定、现实分轨和股票文字/图片冻结一致性。"
tests:
  - test_id: "STABLE-001"
    situation: "同一局式、同一股票、同一十日预测起点，在另一个对话窗口重新提问，输入没有变化。"
    expect:
      - "复用相同取用、九级卦象定性、主趋势和十日原始方向，不从零自由重断。"
      - "若新推演与既有冻结结论冲突且无合法变化原因，判为分析漂移并回退。"
  - test_id: "STABLE-002"
    situation: "同一股票局午盘与收盘行情不同，但没有重新起局。"
    expect:
      - "卦象定性与十日原始方向保持不变。"
      - "只更新现实市场快照、关键区域、现实冲突和行动建议。"
  - test_id: "STABLE-003"
    situation: "同一盘的问题措辞从近期走势改为未来十日怎么看，但预测范围实质相同。"
    expect:
      - "识别为同盘同问，不因措辞变化更换主用或定性。"
  - test_id: "STABLE-004"
    situation: "股票文字部分冻结为平偏凶，随后生成六模块图片。"
    expect:
      - "图片卦象定性必须逐字为平偏凶，十日日期、方向、建议与文字完全一致。"
      - "图片不得自行生成第二个吉凶判断或改变重点日期。"
  - test_id: "STABLE-005"
    situation: "用户提供较高持仓成本，但标的原局走势判断偏弱。"
    expect:
      - "用户成本只进入关键区域/现实建议，不反推卦象等级或十日原始方向。"
