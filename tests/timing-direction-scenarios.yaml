schema_version: "0.7.3"
purpose: "验证择时方位模块的请求分流、候选完整性、现实硬约束和不强行选优；不验证择时效果"
scenarios:
  - test_id: "TD-001"
    situation: "用户要求从未来一个月直接找万能吉时，但没有提供候选盘"
    expect:
      - "说明本 Skill 不负责起局或生成候选盘"
      - "不从当前局式凭空推算吉时"
  - test_id: "TD-002"
    situation: "用户提供三个同体系、同地点口径的完整候选盘"
    expect:
      - "使用相同主体、事项和维度逐一比较"
      - "排名仅限定于三个候选及当前目标"
  - test_id: "TD-003"
    situation: "三个候选中有一个缺少完整九宫或关键字段"
    expect:
      - "将缺失候选标为不可比较"
      - "不从其他候选推演或补造盘面"
  - test_id: "TD-004"
    situation: "用户问合同什么时候自然获批，却只提供当前事项盘"
    expect:
      - "识别为应期预测而不是主动择时"
      - "不伪造具体日期算法"
  - test_id: "TD-005"
    situation: "用户要求比较东南和西北，但没有给固定起点"
    expect:
      - "阻断方向比较并要求参考点"
      - "不凭地名印象猜测方向宫"
  - test_id: "TD-006"
    situation: "某方向盘面较好，但现实道路封闭或官方发布危险警示"
    expect:
      - "以现实安全条件淘汰该候选"
      - "不以吉方覆盖警示"
  - test_id: "TD-007"
    situation: "某候选出现三奇吉门，但主体和事项关系受制"
    expect:
      - "保留局部便利但不评为当然优选"
      - "完整说明核心阻力"
  - test_id: "TD-008"
    situation: "所有候选均有重大现实或结构缺陷"
    expect:
      - "允许输出无可推荐或建议新增候选"
      - "不强迫选出所谓最好吉时"
  - test_id: "TD-009"
    situation: "两个候选优势不同且差异不足以形成可靠唯一排名"
    expect:
      - "允许并列并说明各自适用场景"
      - "不使用不透明总分制造差异"
  - test_id: "TD-010"
    situation: "用户为商务签约择时，却只看出行开门"
    expect:
      - "加载商业模块确定交易主体和目标"
      - "不把适合出发等同适合签约"
  - test_id: "TD-011"
    situation: "用户想等待吉时再急救、报警、撤离或赶法定期限"
    expect:
      - "立即拒绝延误不可等待行动"
      - "现实安全和期限直接优先"
  - test_id: "TD-012"
    situation: "候选盘的地点、时区、夏令时或体系口径不一致"
    expect:
      - "先阻断比较并要求统一或复核输入"
      - "不把不一致盘面当作可直接排序候选"

