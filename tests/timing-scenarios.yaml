schema_version: "1.2.0"
purpose: "验证通用候选应期的目标事件、证据池、窗口、置信度和失效条件；不验证日期准确率"
scenarios:
  - test_id: "TM-001"
    situation: "用户问工作调动何时应，但未说明消息、审批、文件还是到岗"
    expect:
      - "先定义可观察目标事件"
      - "区分事件链中的不同阶段"
  - test_id: "TM-002"
    situation: "只因用神落在某宫支就出现一个候选日期"
    expect:
      - "只能列为低置信候选"
      - "不把单一地支写成必应日"
  - test_id: "TM-003"
    situation: "空亡宫存在填实候选但没有其他证据"
    expect:
      - "不说填实日必应"
      - "降低置信度并说明现实条件"
  - test_id: "TM-004"
    situation: "人物宫、关系宫、事情宫在三个相邻窗口依次被独立触发"
    expect:
      - "检验连续触宫是否吻合事件链"
      - "优先解释为人物变化到互动再到落实"
  - test_id: "TM-005"
    situation: "三个触发日期顺序与现实事件链相反"
    expect:
      - "降低连续触宫权重"
      - "不强拼时间链"
  - test_id: "TM-006"
    situation: "短线交易和长期婚姻都要求应期"
    expect:
      - "分别选择时日与月年尺度"
      - "不把所有问题压成几天"
  - test_id: "TM-007"
    situation: "多个独立证据集中于同一日且现实流程允许"
    expect:
      - "允许指出该日值得重点观察"
      - "仍使用概率语言和失效条件"
  - test_id: "TM-008"
    situation: "候选触发来自未人工复核的程序反吟标记"
    expect:
      - "只进入敏感性轨"
      - "不得形成高置信窗口"
  - test_id: "TM-009"
    situation: "存在五个零散候选日期"
    expect:
      - "只保留最多三个主要窗口"
      - "按相关性和独立证据排序"
  - test_id: "TM-010"
    situation: "盘面触发较集中但现实审批尚未启动"
    expect:
      - "候选可能只对应较早流程节点"
      - "不直接预测文件下达"
  - test_id: "TM-011"
    situation: "重要应期窗口只有两项独立依据"
    expect:
      - "如实列出依据并降低置信度"
      - "不虚构第三项依据"
  - test_id: "TM-012"
    situation: "用户要在已有三个候选盘中选主动签约时间"
    expect:
      - "路由到择时方位模块"
      - "不与自然发生的应期混用"
